services:
  - type: web
    name: earth-system-trend-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Free compute avoids any payment method, but has low memory/CPU and no durable disk.
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: EARTH_DATA_DIR
        value: /tmp/earth-data
      - key: CORS_ORIGINS
        value: https://rushing-juniper-kyg03sf.tmp.now
      - key: CORS_ORIGIN_REGEX
        value: '^https://rushing-juniper-kyg03sf-[a-z0-9]+-jay-78ad\.vercel\.app$'
      - key: NASA_EARTHDATA_USERNAME
        sync: false
      - key: NASA_EARTHDATA_PASSWORD
        sync: false
      - key: NOAA_CDO_TOKEN
        sync: false
