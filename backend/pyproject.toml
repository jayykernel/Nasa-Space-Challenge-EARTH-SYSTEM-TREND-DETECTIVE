[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "earth-system-trend-detective-backend"
version = "0.1.0"
description = "Backend for Earth System Trend Detective NASA Space Apps Challenge 2026"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "earthaccess>=0.19.0",
    "xarray>=2023.06.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
        "pymannkendall>=1.5.0",
    "geopandas>=0.13.0",
    "boto3>=1.34.0",
]

[tool.poetry.dev-dependencies]

[tool.poetry.scripts]
ed-backend = "app.main:main"

[tool.poetry.dependencies]