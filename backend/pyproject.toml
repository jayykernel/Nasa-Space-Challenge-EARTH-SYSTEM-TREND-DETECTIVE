[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "earth-system-trend-detective-backend"
version = "0.1.0"
description = "Backend for Earth System Trend Detective NASA Space Apps Challenge 2026"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "earthaccess>=0.19.0",
    "h5netcdf>=1.3.0",
    "h5py>=3.10.0",
    "python-dotenv>=1.0.0",
    "xarray>=2023.06.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "shapely>=2.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.scripts]
ed-backend = "app.main:main"

[tool.poetry.dependencies]
